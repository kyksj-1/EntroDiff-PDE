# =============================================================================
# DiT EDM baseline reference (1000 samples, capacity-matched with the DiT plain run).
# Pure EDM training: log-normal sigma, L_DSM only, no BV / time regularizers.
# =============================================================================

experiment:
  name: "edm_baseline_dit"
  epochs: 200
  learning_rate: 2.0e-4
  batch_size: 64
  grad_accum_steps: 1
  use_amp: false
  nu: 1.0
  tau_max: 1.0
  ckpt_every: 50
  use_ema: false
  schedule_type: "baseline"       # EDM log-normal sigma

model:
  type: "dit_plain"
  in_channels: 2
  dit:
    Nx: 128
    dim: 256
    n_layers: 6
    n_heads: 8
    patch_size: 4
    dropout: 0.1
    n_pde_types: 1

loss:
  lambda_dsm: 1.0
  lambda_bv: 0.0
  lambda_time: 0.0

data:
  conditioning_type: "ic"
  mix_strategy: "uniform"
  data_limit: 1000               # ← 与 revisit 对齐
  pdes:
    - name: "burgers"
      data_file: "burgers_1d_N5000_Nx128.npy"
      flux_type: "burgers"
      weight: 1.0
