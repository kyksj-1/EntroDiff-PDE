# =============================================================================
# Foundation Model · SMOKE TEST configuration (Burgers only, 2 epochs).
# Purpose: end-to-end smoke test of `train_foundation.py`; finishes in ~5 minutes.
# =============================================================================

experiment:
  name: "foundation_smoke"
  epochs: 2                   # 2 epochs is enough to verify the pipeline
  learning_rate: 2.0e-4
  batch_size: 8
  grad_accum_steps: 1
  use_amp: false

  nu: 1.0
  tau_max: 1.0

  ckpt_every: 2

model:
  type: "dit_plain"           # plain variant for smoke (faster, no second-order autograd)
  in_channels: 2

  dit:
    Nx: 128
    dim: 64                   # very small
    n_layers: 2
    n_heads: 4
    patch_size: 4
    dropout: 0.0

loss:
  lambda_dsm: 1.0
  lambda_bv: 0.05
  lambda_time: 0.0            # disable time loss for smoke (saves time)

data:
  conditioning_type: "ic"
  mix_strategy: "uniform"
  pdes:
    - name: "burgers"
      data_file: "burgers_1d_N5000_Nx128.npy"
      flux_type: "burgers"
      weight: 1.0
