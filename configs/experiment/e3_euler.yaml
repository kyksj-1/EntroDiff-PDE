# =============================================================================
# E3 · 1D Euler Sod shock-tube experiment configuration.
# Three-component conservation laws (rho, rho*u, E) with simultaneous shock,
# contact discontinuity, and rarefaction.
# =============================================================================
experiment:
  name: "e3_euler_run"
  epochs: 200                                 # systems are harder than scalar laws; match BL
  learning_rate: 2.0e-4

  # --- VE-SDE parameters ---
  nu: 1.0                                     # VE-SDE unit viscosity (sigma^2 = 2*nu*tau)
  tau_max: 1.0                                # maximum diffusion time

  # --- Loss weights ---
  lambda_bv: 0.1                              # BV total-variation regularizer weight
  lambda_dsm: 1.0                             # denoising score-matching weight
  lambda_time: 1.0                            # Godunov one-step time-consistency weight

  # --- Sampling ---
  heun_steps: 50                              # Heun (2nd-order) ODE integration steps
  zeta_pde: 0.0                               # PDE guidance weight (0 = unconditional sampling)

  # --- Optimisation ---
  ema_decay: 0.9999                           # EMA decay for the sampling model
  lr_scheduler: "cosine"                      # cosine learning-rate annealing
  grad_clip_norm: 1.0                         # gradient-norm clip (mitigates blow-up at shocks)

  # --- Data ---
  # Generated by `scripts/generate_euler_data.py` (not bundled in this public release).
  data_file: "euler_sod_1d_N5000_Nx128.npy"

  # --- Model ---
  model_type: "bvaware"                       # BV-aware score parameterization
  use_ic: true                                # IC conditioning
  in_channels: 6                              # 3 noisy U + 3 IC U_0 channels
  out_channels: 3                             # 3 conservative variables (rho, rho*u, E)
  n_components: 3                             # number of Euler components
  dim: 128                                    # UNet hidden dim
