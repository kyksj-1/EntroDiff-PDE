# Burgers MVP experiment configuration (full method).
experiment:
  name: "mvp_burgers_run1"
  epochs: 50              # full epochs (use 10 for a quick smoke test)
  learning_rate: 2.0e-4   # Adam learning rate (EDM-recommended)

  # Physical / method parameters
  nu: 1.0                 # VE-SDE unit viscosity (sigma^2 = 2*nu*tau)
                          # sigma_max = sqrt(2 * 1 * 1) ~ 1.41, covers data std ~ 1.34
  tau_max: 1.0            # T_d, maximum diffusion time

  # Loss weights
  lambda_bv: 0.1          # BV / TV regularizer weight (0 = baseline, >0 = ours)
  lambda_dsm: 1.0         # denoising score-matching weight (fixed at 1.0)

  # Sampler settings (reverse-time ODE)
  heun_steps: 50          # Heun (2nd-order) integration steps
  zeta_pde: 0.0           # Godunov PDE guidance strength (0 = unconditional)

  # IC conditioning (modularised across training / evaluation / MVP)
  # type="ic": concatenate the t=0 frame as an extra channel
  # type="none": unconditional sampling (pure diffusion, in_channels=1)
  # in_channels_extra: number of extra conditioning channels (ic=1)
  conditioning:
    type: "ic"
    in_channels_extra: 1
