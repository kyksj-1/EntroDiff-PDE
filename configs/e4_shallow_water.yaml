# =============================================================================
# config/e4_shallow_water.yaml · 2D shallow-water (e.g. circular dam break)
# =============================================================================
experiment:
  name: "E4_shallow_water"
  seed: 0

data:
  pde: "shallow_water"
  N_x: 64
  N_y: 64
  T: 0.5
  n_samples: 1024
  g: 9.81

model:
  type: "bvaware"
  in_channels: 1            # predicts the water depth h
  hidden_dim: 96            # widened for 2D
  dims: 2                   # 2D convolutions

schedule:
  type: "viscosity_matched"
  nu_phys: 0.0
  T_d: 1.0

loss:
  lambda_ent: 0.1
  lambda_bv: 0.05
  lambda_burg: 0.01

train:
  total_steps: 300000
